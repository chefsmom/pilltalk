<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Pill Talk"/>
<meta name="theme-color" content="#ffffff"/>
<title>Symptom Checker — Pill Talk</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<link rel="manifest" href="/manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#059669;--teal-d:#047857;--teal-dd:#065f46;--teal-50:#ecfdf5;--teal-100:#d1fae5;
  --g900:#111827;--g800:#1f2937;--g700:#374151;--g600:#4b5563;--g500:#6b7280;
  --g400:#9ca3af;--g300:#d1d5db;--g200:#e5e7eb;--g150:#eeeff1;--g100:#f3f4f6;--g50:#f9fafb;
  --red:#dc2626;--red-bg:#fef2f2;--red-b:#fecaca;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-b:#fde68a;
  --green:#16a34a;--green-bg:#f0fdf4;--green-b:#bbf7d0;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-b:#bfdbfe;
  --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
}
html{height:100%;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--g50);color:var(--g900);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(83px + var(--safe-bottom))}
.status-bar{height:var(--safe-top);background:#fff}
.app-header{background:#fff;border-bottom:0.5px solid var(--g200);padding:12px 20px;position:sticky;top:var(--safe-top);z-index:50}
.app-title{font-size:17px;font-weight:700;letter-spacing:-.2px}
.header-logo{display:flex;align-items:center;gap:8px}
.header-logo img{width:28px;height:28px;border-radius:7px}
main{padding:16px 16px 8px}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:16px}
.card-label{font-size:13px;font-weight:600;color:var(--g600);margin-bottom:10px}
.med-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--teal-50);border-radius:20px;font-size:13px;font-weight:500;color:var(--teal-dd);margin:3px}
.med-tag button{background:none;border:none;cursor:pointer;color:var(--teal-dd);font-size:14px;opacity:.6}
.chips-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g400);margin-bottom:8px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sym-chip{padding:8px 14px;border:1.5px solid var(--g200);border-radius:20px;font-size:14px;font-weight:500;color:var(--g700);cursor:pointer;background:#fff;font-family:inherit;transition:all .15s;-webkit-appearance:none}
.sym-chip:active{transform:scale(.96)}
.sym-chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
input[type=text],textarea{width:100%;padding:12px 14px;font-size:15px;font-family:inherit;border:1.5px solid var(--g200);border-radius:12px;background:var(--g50);color:var(--g900);outline:none;-webkit-appearance:none;transition:border-color .15s;margin-bottom:8px}
input[type=text]:focus,textarea:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(5,150,105,.08)}
input::placeholder,textarea::placeholder{color:var(--g400)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.btn-primary{padding:14px;background:var(--teal);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;-webkit-appearance:none;box-shadow:0 2px 8px rgba(5,150,105,.3);margin-bottom:12px}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:var(--g300);box-shadow:none}
.warning-card{background:var(--amber-bg);border:1px solid var(--amber-b);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--amber);line-height:1.6;margin-bottom:12px}
.error-box{display:none;padding:14px 16px;background:var(--red-bg);border-radius:12px;color:var(--red);font-size:14px;margin-bottom:12px;border:1px solid var(--red-b)}
.spinner{display:none;text-align:center;padding:48px 0}
.spin-ring{width:32px;height:32px;border:3px solid var(--g200);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-txt{font-size:14px;color:var(--g500)}
#result{display:none}
.risk-card{border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:12px}
.risk-low{background:var(--green-bg);border:1px solid var(--green-b)}
.risk-moderate{background:var(--amber-bg);border:1px solid var(--amber-b)}
.risk-high{background:var(--red-bg);border:1px solid var(--red-b)}
.risk-icon{font-size:28px;flex-shrink:0}
.risk-text{font-size:15px;font-weight:500;line-height:1.5;color:var(--g800)}
.urgent-card{background:var(--red-bg);border:2px solid var(--red);border-radius:16px;padding:16px;margin-bottom:12px;display:none}
.urgent-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--red);margin-bottom:6px}
.urgent-text{font-size:14px;font-weight:600;color:var(--red);line-height:1.6}
.finding-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.finding-card.green{border-left:4px solid #22c55e}
.finding-card.yellow{border-left:4px solid #f59e0b}
.finding-card.red{border-left:4px solid #ef4444}
.finding-inner{padding:14px 16px}
.finding-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.finding-symptom{font-size:15px;font-weight:700}
.finding-chip{font-size:11px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.fc-green{background:var(--green-bg);color:var(--green)}
.fc-yellow{background:var(--amber-bg);color:var(--amber)}
.fc-red{background:var(--red-bg);color:var(--red)}
.finding-drug{font-size:12px;color:var(--g400);font-style:italic}
.finding-exp{font-size:14px;color:var(--g600);margin-bottom:8px;line-height:1.6}
.finding-action{font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.fa-monitor{background:var(--green-bg);color:var(--green)}
.fa-call{background:var(--amber-bg);color:var(--amber)}
.fa-er{background:var(--red-bg);color:var(--red)}
.disclaimer{font-size:11px;color:var(--g400);background:var(--g50);border-radius:12px;padding:12px 14px;line-height:1.6;margin-top:12px}
.btn-ghost{padding:10px 16px;background:var(--g50);border:1px solid var(--g200);border-radius:10px;font-size:13px;font-weight:500;color:var(--g700);cursor:pointer;font-family:inherit}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,.12);display:flex;padding-bottom:var(--safe-bottom);z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:50px}
.tab-icon{font-size:22px;line-height:1;margin-bottom:3px;transition:transform .15s}
.tab-label{font-size:10px;font-weight:500;color:var(--g400)}
.tab-item.on .tab-label{color:var(--teal);font-weight:700}
.tab-item.on .tab-icon{transform:scale(1.1)}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
</style>
</head>
<body>
<div class="status-bar"></div>
<div class="app-header">
  <div class="header-logo">
    <img src="/icon.svg" alt="Pill Talk"/>
    <span class="app-title">Symptom Checker</span>
  </div>
</div>
<main>
  <div class="warning-card">&#9888; This is not a medical diagnosis. Call 911 for emergencies.</div>

  <div class="card">
    <div class="card-label">Your medications</div>
    <input type="text" id="medInput" placeholder="Add a medication..."/>
    <div id="medTags" style="margin-top:4px;min-height:28px"></div>
  </div>

  <div class="card">
    <div class="chips-label">Quick select symptoms</div>
    <div class="chips-wrap">
      <button class="sym-chip" onclick="toggleChip(this,'Nausea')">&#129298; Nausea</button>
      <button class="sym-chip" onclick="toggleChip(this,'Headache')">&#129354; Headache</button>
      <button class="sym-chip" onclick="toggleChip(this,'Dizziness')">&#129529; Dizziness</button>
      <button class="sym-chip" onclick="toggleChip(this,'Fatigue')">&#128564; Fatigue</button>
      <button class="sym-chip" onclick="toggleChip(this,'Stomach pain')">&#129760; Stomach pain</button>
      <button class="sym-chip" onclick="toggleChip(this,'Diarrhea')">Diarrhea</button>
      <button class="sym-chip" onclick="toggleChip(this,'Vomiting')">&#129314; Vomiting</button>
      <button class="sym-chip" onclick="toggleChip(this,'Rash or itching')">Rash/Itch</button>
      <button class="sym-chip" onclick="toggleChip(this,'Dry mouth')">Dry mouth</button>
      <button class="sym-chip" onclick="toggleChip(this,'Muscle pain')">&#128170; Muscle pain</button>
      <button class="sym-chip" onclick="toggleChip(this,'Rapid heartbeat')">&#128147; Heart racing</button>
      <button class="sym-chip" onclick="toggleChip(this,'Trouble sleeping')">&#128336; Insomnia</button>
      <button class="sym-chip" onclick="toggleChip(this,'Blurred vision')">Blurred vision</button>
      <button class="sym-chip" onclick="toggleChip(this,'Swelling')">Swelling</button>
      <button class="sym-chip" onclick="toggleChip(this,'Shortness of breath')">&#128168; Short of breath</button>
      <button class="sym-chip" onclick="toggleChip(this,'Chest pain')">&#128148; Chest pain</button>
      <button class="sym-chip" onclick="toggleChip(this,'Constipation')">Constipation</button>
      <button class="sym-chip" onclick="toggleChip(this,'Loss of appetite')">No appetite</button>
      <button class="sym-chip" onclick="toggleChip(this,'Anxiety')">&#128543; Anxiety</button>
      <button class="sym-chip" onclick="toggleChip(this,'Low mood')">&#129297; Low mood</button>
    </div>
    <div class="card-label">Or describe in your own words</div>
    <textarea id="symptomInput" placeholder="e.g. I have a headache and feel nauseous after taking my medication..."></textarea>
  </div>

  <button class="btn-primary" id="checkBtn" onclick="checkSymptoms()">Check My Symptoms</button>

  <div class="error-box" id="errorBox"></div>
  <div class="spinner" id="spinner"><div class="spin-ring"></div><div class="spin-txt">Analyzing symptoms...</div></div>

  <div id="result">
    <div class="risk-card" id="riskCard">
      <div class="risk-icon" id="riskIcon"></div>
      <div class="risk-text" id="riskText"></div>
    </div>
    <div class="urgent-card" id="urgentCard">
      <div class="urgent-label">&#128680; Take action now</div>
      <div class="urgent-text" id="urgentText"></div>
    </div>
    <div id="findings"></div>
    <div class="disclaimer" id="disclaimerCard"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-ghost" onclick="copyReport()" style="flex:1">&#10232; Copy</button>
      <button class="btn-ghost" onclick="clearAll()" style="flex:1">&#8635; Reset</button>
    </div>
  </div>
</main>

<nav class="tab-bar">
  <a class="tab-item" href="/app"><div class="tab-icon">&#128138;</div><div class="tab-label">Look Up</div></a>
  <a class="tab-item" href="/mymeds"><div class="tab-icon">&#128137;</div><div class="tab-label">My Meds</div></a>
  <a class="tab-item on" href="/symptoms"><div class="tab-icon">&#128308;</div><div class="tab-label">Symptoms</div></a>
  <a class="tab-item" href="/tracker"><div class="tab-icon">&#128197;</div><div class="tab-label">Tracker</div></a>
  <a class="tab-item" href="/medcard"><div class="tab-icon">&#128203;</div><div class="tab-label">Med Card</div></a>
</nav>

<script>
var meds=JSON.parse(localStorage.getItem('pilltalk_meds')||'[]');
var selectedChips=[];
var lastReport={};

function renderTags(){
  var el=document.getElementById('medTags');
  if(!meds.length){el.innerHTML='<span style="font-size:13px;color:var(--g400)">No medications added</span>';return;}
  el.innerHTML=meds.map(function(m,i){return '<span class="med-tag">'+m+'<button onclick="removeMed('+i+')">&#10005;</button></span>';}).join('');
}
function addMed(){
  var v=document.getElementById('medInput').value.trim();
  if(!v)return;
  if(meds.indexOf(v)===-1){meds.push(v);localStorage.setItem('pilltalk_meds',JSON.stringify(meds));}
  document.getElementById('medInput').value='';renderTags();
}
function removeMed(i){meds.splice(i,1);localStorage.setItem('pilltalk_meds',JSON.stringify(meds));renderTags();}
function toggleChip(btn,symptom){
  var idx=selectedChips.indexOf(symptom);
  if(idx===-1){selectedChips.push(symptom);btn.classList.add('on');}
  else{selectedChips.splice(idx,1);btn.classList.remove('on');}
  var ta=document.getElementById('symptomInput');
  var manual=ta.value.replace(/^Selected:.*\n?/,'').trim();
  var chipTxt=selectedChips.length?'Selected: '+selectedChips.join(', '):'';
  ta.value=[chipTxt,manual].filter(Boolean).join('\n');
}
function showError(msg){var el=document.getElementById('errorBox');el.textContent=msg;el.style.display='block';document.getElementById('spinner').style.display='none';document.getElementById('checkBtn').disabled=false;}
function checkSymptoms(){
  var syms=document.getElementById('symptomInput').value.trim();
  if(!syms){showError('Please describe your symptoms.');return;}
  document.getElementById('errorBox').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('spinner').style.display='block';
  document.getElementById('checkBtn').disabled=true;
  fetch('/check-symptoms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({drugs:meds,symptoms:syms,level:'simple and clear language'})})
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.error){showError(data.error);return;}
    lastReport=data;
    var risk=(data.overallRisk||'low').toLowerCase();
    var card=document.getElementById('riskCard');
    card.className='risk-card risk-'+risk;
    document.getElementById('riskIcon').textContent=risk==='high'?'🚨':risk==='moderate'?'⚠️':'✅';
    document.getElementById('riskText').textContent=data.overallSummary||'';
    var urgent=document.getElementById('urgentCard');
    if(data.urgentAction&&data.urgentAction.trim().length>2){document.getElementById('urgentText').textContent=data.urgentAction;urgent.style.display='block';}
    else urgent.style.display='none';
    var findings=document.getElementById('findings');
    var fdata=data.findings||[];
    findings.innerHTML=fdata.map(function(f){
      var sev=(f.severity||'green').toLowerCase();
      var chipClass='fc-'+(sev==='red'?'red':sev==='yellow'?'yellow':'green');
      var actionClass='fa-'+(sev==='red'?'er':sev==='yellow'?'call':'monitor');
      var actionIcon=sev==='red'?'🚨':sev==='yellow'?'📞':'✓';
      return '<div class="finding-card '+sev+'"><div class="finding-inner"><div class="finding-top"><span class="finding-symptom">'+(f.symptom||'')+'</span><span class="finding-chip '+chipClass+'">'+(f.category||'')+'</span>'+(f.drug?'<span class="finding-drug">'+f.drug+'</span>':'')+'</div><div class="finding-exp">'+(f.explanation||'')+'</div><div class="finding-action '+actionClass+'">'+actionIcon+' '+(f.action||'')+'</div></div></div>';
    }).join('');
    document.getElementById('disclaimerCard').textContent=data.disclaimer||'Always consult a healthcare provider.';
    document.getElementById('spinner').style.display='none';
    document.getElementById('result').style.display='block';
    document.getElementById('checkBtn').disabled=false;
    document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
  })
  .catch(function(err){showError('Could not reach server. ('+err.message+')');});
}
function copyReport(){
  var text='PILL TALK - SYMPTOM CHECK\nMedications: '+(meds.join(', ')||'none')+'\nSymptoms: '+document.getElementById('symptomInput').value+'\n\nSUMMARY: '+(lastReport.overallSummary||'');
  navigator.clipboard.writeText(text);
}
function clearAll(){document.getElementById('symptomInput').value='';document.getElementById('result').style.display='none';document.getElementById('errorBox').style.display='none';selectedChips=[];document.querySelectorAll('.sym-chip').forEach(function(b){b.classList.remove('on');});}
document.getElementById('medInput').addEventListener('keydown',function(e){if(e.key==='Enter')addMed();});
renderTags();
</script>
</body>
</html>
