<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Pill Talk"/>
<meta name="theme-color" content="#ffffff"/>
<title>Med Card — Pill Talk</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<link rel="manifest" href="/manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#059669;--teal-d:#047857;--teal-dd:#065f46;--teal-50:#ecfdf5;--teal-100:#d1fae5;
  --g900:#111827;--g800:#1f2937;--g700:#374151;--g600:#4b5563;--g500:#6b7280;
  --g400:#9ca3af;--g300:#d1d5db;--g200:#e5e7eb;--g150:#eeeff1;--g100:#f3f4f6;--g50:#f9fafb;
  --red:#dc2626;--red-bg:#fef2f2;
  --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
}
html{height:100%;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--g50);color:var(--g900);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(83px + var(--safe-bottom))}
.status-bar{height:var(--safe-top);background:#fff}
.app-header{background:#fff;border-bottom:0.5px solid var(--g200);padding:12px 20px;position:sticky;top:var(--safe-top);z-index:50;display:flex;align-items:center;justify-content:space-between}
.app-title{font-size:17px;font-weight:700;letter-spacing:-.2px}
.header-logo{display:flex;align-items:center;gap:8px}
.header-logo img{width:28px;height:28px;border-radius:7px}
main{padding:16px 16px 8px}
/* The card itself */
.medcard{
  background:linear-gradient(145deg,#059669 0%,#047857 50%,#065f46 100%);
  border-radius:20px;padding:20px;margin-bottom:16px;color:#fff;
  box-shadow:0 8px 30px rgba(5,150,105,.35);position:relative;overflow:hidden;
}
.medcard::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.medcard::after{content:'';position:absolute;bottom:-30px;left:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05)}
.mc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mc-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;opacity:.9}
.mc-logo img{width:24px;height:24px;border-radius:6px;filter:brightness(0) invert(1)}
.mc-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.mc-name{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px}
.mc-dob{font-size:13px;opacity:.75;margin-bottom:14px}
.mc-row{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.mc-field{flex:1;min-width:120px}
.mc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.65;margin-bottom:3px}
.mc-value{font-size:14px;font-weight:600;line-height:1.4}
.mc-meds{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.mc-meds-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.65;margin-bottom:8px}
.mc-med-list{display:flex;flex-wrap:wrap;gap:5px}
.mc-med{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;backdrop-filter:blur(4px)}
/* Form */
.form-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.form-section{padding:14px 16px;border-bottom:0.5px solid var(--g100)}
.form-section:last-child{border-bottom:none}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g400);margin-bottom:8px}
input[type=text]{width:100%;padding:11px 14px;font-size:15px;font-family:inherit;border:1.5px solid var(--g200);border-radius:10px;background:var(--g50);color:var(--g900);outline:none;-webkit-appearance:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(5,150,105,.08)}
input::placeholder{color:var(--g400)}
.allergy-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.allergy-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;background:var(--red-bg);border-radius:20px;font-size:13px;font-weight:500;color:var(--red)}
.allergy-tag button{background:none;border:none;cursor:pointer;color:var(--red);font-size:13px}
.btn-primary{padding:14px;background:var(--teal);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;-webkit-appearance:none;box-shadow:0 2px 8px rgba(5,150,105,.3);margin-bottom:8px}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{padding:12px;background:var(--g50);border:1px solid var(--g200);border-radius:12px;font-size:14px;font-weight:500;color:var(--g700);cursor:pointer;font-family:inherit;width:100%;margin-bottom:8px}
.btn-ghost:active{background:var(--g100)}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,.12);display:flex;padding-bottom:var(--safe-bottom);z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;text-decoration:none;cursor:pointer;min-height:50px}
.tab-icon{font-size:22px;line-height:1;margin-bottom:3px;transition:transform .15s}
.tab-label{font-size:10px;font-weight:500;color:var(--g400)}
.tab-item.on .tab-label{color:var(--teal);font-weight:700}
.tab-item.on .tab-icon{transform:scale(1.1)}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
</style>
</head>
<body>
<div class="status-bar"></div>
<div class="app-header">
  <div class="header-logo">
    <img src="/icon.svg" alt="Pill Talk"/>
    <span class="app-title">Med Card</span>
  </div>
  <button onclick="saveCard()" style="background:var(--teal);color:#fff;border:none;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Save</button>
</div>
<main>
  <!-- Live card preview -->
  <div class="medcard" id="preview">
    <div class="mc-header">
      <div class="mc-logo"><img src="/icon.svg" alt=""/> Pill Talk</div>
      <div class="mc-tag">Emergency Med Card</div>
    </div>
    <div class="mc-name" id="prev-name">Your Name</div>
    <div class="mc-dob" id="prev-dob">Date of birth not set</div>
    <div class="mc-row">
      <div class="mc-field"><div class="mc-label">Blood type</div><div class="mc-value" id="prev-blood">—</div></div>
      <div class="mc-field"><div class="mc-label">Primary care</div><div class="mc-value" id="prev-doc">—</div></div>
      <div class="mc-field"><div class="mc-label">Emergency contact</div><div class="mc-value" id="prev-contact">—</div></div>
    </div>
    <div id="prev-allergy-section">
      <div class="mc-label" style="margin-top:10px;margin-bottom:5px">Allergies</div>
      <div class="mc-value" id="prev-allergies" style="font-size:13px;opacity:.9">None listed</div>
    </div>
    <div class="mc-meds" id="prev-meds-section">
      <div class="mc-meds-label">Medications</div>
      <div class="mc-med-list" id="prev-meds"></div>
    </div>
  </div>

  <!-- Form -->
  <div class="form-card">
    <div class="form-section">
      <div class="form-label">Full name</div>
      <input type="text" id="fName" placeholder="Your full name" oninput="updatePreview()"/>
    </div>
    <div class="form-section">
      <div class="form-label">Date of birth</div>
      <input type="text" id="fDob" placeholder="MM/DD/YYYY" oninput="updatePreview()"/>
    </div>
    <div class="form-section">
      <div class="form-label">Blood type</div>
      <input type="text" id="fBlood" placeholder="e.g. A+, O-" oninput="updatePreview()"/>
    </div>
    <div class="form-section">
      <div class="form-label">Primary care provider</div>
      <input type="text" id="fDoc" placeholder="Doctor name & phone" oninput="updatePreview()"/>
    </div>
    <div class="form-section">
      <div class="form-label">Emergency contact</div>
      <input type="text" id="fContact" placeholder="Name & phone number" oninput="updatePreview()"/>
    </div>
    <div class="form-section">
      <div class="form-label">Allergies</div>
      <input type="text" id="allergyInput" placeholder="Add an allergy..."/>
      <div class="allergy-tags" id="allergyTags"></div>
    </div>
  </div>

  <button class="btn-primary" onclick="saveCard()">&#10003; Save Card</button>
  <button class="btn-ghost" onclick="shareCard()">&#128279; Share card link</button>
  <button class="btn-ghost" onclick="printCard()">&#128438; Print</button>
</main>

<nav class="tab-bar">
  <a class="tab-item" href="/app"><div class="tab-icon">&#128138;</div><div class="tab-label">Look Up</div></a>
  <a class="tab-item" href="/mymeds"><div class="tab-icon">&#128137;</div><div class="tab-label">My Meds</div></a>
  <a class="tab-item" href="/symptoms"><div class="tab-icon">&#128308;</div><div class="tab-label">Symptoms</div></a>
  <a class="tab-item" href="/tracker"><div class="tab-icon">&#128197;</div><div class="tab-label">Tracker</div></a>
  <a class="tab-item on" href="/medcard"><div class="tab-icon">&#128203;</div><div class="tab-label">Med Card</div></a>
</nav>

<script>
var data=JSON.parse(localStorage.getItem('pt_medcard')||'{}');
var allergies=data.allergies||[];
var meds=JSON.parse(localStorage.getItem('pilltalk_meds')||'[]');
function load(){
  if(data.name) document.getElementById('fName').value=data.name;
  if(data.dob) document.getElementById('fDob').value=data.dob;
  if(data.blood) document.getElementById('fBlood').value=data.blood;
  if(data.doc) document.getElementById('fDoc').value=data.doc;
  if(data.contact) document.getElementById('fContact').value=data.contact;
  renderAllergies();updatePreview();
}
function updatePreview(){
  var name=document.getElementById('fName').value.trim()||'Your Name';
  var dob=document.getElementById('fDob').value.trim();
  var blood=document.getElementById('fBlood').value.trim();
  var doc=document.getElementById('fDoc').value.trim();
  var contact=document.getElementById('fContact').value.trim();
  document.getElementById('prev-name').textContent=name;
  document.getElementById('prev-dob').textContent=dob?'DOB: '+dob:'Date of birth not set';
  document.getElementById('prev-blood').textContent=blood||'—';
  document.getElementById('prev-doc').textContent=doc||'—';
  document.getElementById('prev-contact').textContent=contact||'—';
  document.getElementById('prev-allergies').textContent=allergies.length?allergies.join(', '):'None listed';
  var medEl=document.getElementById('prev-meds');
  medEl.innerHTML=meds.length?meds.map(function(m){return '<span class="mc-med">'+m+'</span>';}).join(''):'<span style="opacity:.7;font-size:13px">No medications added</span>';
}
function renderAllergies(){
  var el=document.getElementById('allergyTags');
  el.innerHTML=allergies.map(function(a,i){return '<span class="allergy-tag">'+a+'<button onclick="removeAllergy('+i+')">&#10005;</button></span>';}).join('');
  updatePreview();
}
function addAllergy(){
  var v=document.getElementById('allergyInput').value.trim();
  if(!v)return;
  allergies.push(v);document.getElementById('allergyInput').value='';renderAllergies();
}
function removeAllergy(i){allergies.splice(i,1);renderAllergies();}
function saveCard(){
  var card={name:document.getElementById('fName').value.trim(),dob:document.getElementById('fDob').value.trim(),blood:document.getElementById('fBlood').value.trim(),doc:document.getElementById('fDoc').value.trim(),contact:document.getElementById('fContact').value.trim(),allergies:allergies};
  localStorage.setItem('pt_medcard',JSON.stringify(card));
  alert('Card saved!');
}
function shareCard(){navigator.clipboard.writeText(window.location.href);alert('Link copied!');}
function printCard(){window.print();}
document.getElementById('allergyInput').addEventListener('keydown',function(e){if(e.key==='Enter')addAllergy();});
load();
</script>
</body>
</html>
