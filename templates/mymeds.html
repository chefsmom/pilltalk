<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Pill Talk"/>
<meta name="theme-color" content="#ffffff"/>
<title>My Medications — Pill Talk</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<link rel="manifest" href="/manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#059669;--teal-d:#047857;--teal-dd:#065f46;--teal-50:#ecfdf5;--teal-100:#d1fae5;
  --g900:#111827;--g800:#1f2937;--g700:#374151;--g600:#4b5563;--g500:#6b7280;
  --g400:#9ca3af;--g300:#d1d5db;--g200:#e5e7eb;--g150:#eeeff1;--g100:#f3f4f6;--g50:#f9fafb;
  --red:#dc2626;--red-bg:#fef2f2;--red-b:#fecaca;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-b:#fde68a;
  --green:#16a34a;--green-bg:#f0fdf4;--green-b:#bbf7d0;
  --blue:#2563eb;--blue-bg:#eff6ff;--blue-b:#bfdbfe;
  --purple:#7c3aed;--purple-bg:#f5f3ff;--purple-b:#ddd6fe;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
html{height:100%;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--g50);color:var(--g900);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(83px + var(--safe-bottom))}
.status-bar{height:var(--safe-top);background:#fff}
.app-header{background:#fff;border-bottom:0.5px solid var(--g200);padding:12px 20px;position:sticky;top:var(--safe-top);z-index:50}
.app-header-inner{display:flex;align-items:center;justify-content:space-between}
.app-title{font-size:17px;font-weight:700;letter-spacing:-.2px}
.header-logo{display:flex;align-items:center;gap:8px}
.header-logo img{width:28px;height:28px;border-radius:7px}
main{padding:16px 16px 8px}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
input[type=text]{width:100%;padding:12px 14px;font-size:15px;font-family:inherit;border:1.5px solid var(--g200);border-radius:12px;background:var(--g50);color:var(--g900);outline:none;-webkit-appearance:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(5,150,105,.08)}
input::placeholder{color:var(--g400)}
.btn-add{padding:12px 18px;background:var(--teal);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-appearance:none;white-space:nowrap;box-shadow:0 2px 6px rgba(5,150,105,.25)}
.btn-add:active{transform:scale(.97)}
.btn-primary{padding:14px;background:var(--g900);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;-webkit-appearance:none}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{padding:10px 16px;background:var(--g50);border:1px solid var(--g200);border-radius:10px;font-size:13px;font-weight:500;color:var(--g700);cursor:pointer;font-family:inherit;-webkit-appearance:none}
.med-row{display:flex;align-items:center;padding:14px 16px;border-bottom:0.5px solid var(--g100)}
.med-row:last-child{border-bottom:none}
.med-icon{width:36px;height:36px;background:var(--teal-50);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-right:12px}
.med-name{font-size:15px;font-weight:600;flex:1}
.med-btns{display:flex;gap:6px}
.med-btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:none;-webkit-appearance:none}
.med-btn-look{background:var(--teal-50);color:var(--teal-dd)}
.med-btn-rm{background:var(--g100);color:var(--g600)}
.empty-state{text-align:center;padding:40px 20px;color:var(--g400)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-txt{font-size:15px;font-weight:500;margin-bottom:4px;color:var(--g600)}
.empty-sub{font-size:13px}
.action-bar{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:none}
.action-bar-info{font-size:14px;color:var(--g600);margin-bottom:12px}
.action-bar-info strong{color:var(--g900);font-weight:700}
.result-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:none}
.result-header{padding:16px;display:flex;align-items:center;gap:12px}
.result-header.safe{background:var(--green-bg)}
.result-header.unsafe{background:var(--red-bg)}
.result-icon{font-size:26px}
.result-summary{font-size:14px;font-weight:500;line-height:1.5;color:var(--g800)}
.int-card{border-bottom:0.5px solid var(--g100)}
.int-card:last-child{border-bottom:none}
.int-card-inner{padding:14px 16px}
.int-severity{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;margin-bottom:6px}
.sev-mild{background:var(--green-bg);color:var(--green)}
.sev-moderate{background:var(--amber-bg);color:var(--amber)}
.sev-serious{background:var(--red-bg);color:var(--red)}
.int-drugs{font-size:15px;font-weight:700;margin-bottom:6px}
.int-desc{font-size:14px;color:var(--g600);line-height:1.5;margin-bottom:8px}
.int-action{font-size:13px;font-weight:600;color:var(--g800);background:var(--g50);padding:8px 12px;border-radius:8px}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g400);padding:12px 16px 6px}
.error-box{display:none;padding:14px 16px;background:var(--red-bg);border-radius:12px;color:var(--red);font-size:14px;margin-bottom:12px;border:1px solid var(--red-b)}
.spinner{display:none;text-align:center;padding:48px 0}
.spin-ring{width:32px;height:32px;border:3px solid var(--g200);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-txt{font-size:14px;color:var(--g500)}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,.12);display:flex;padding-bottom:var(--safe-bottom);z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:50px}
.tab-icon{font-size:22px;line-height:1;margin-bottom:3px;transition:transform .15s}
.tab-label{font-size:10px;font-weight:500;color:var(--g400)}
.tab-item.on .tab-label{color:var(--teal);font-weight:700}
.tab-item.on .tab-icon{transform:scale(1.1)}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
</style>
</head>
<body>
<div class="status-bar"></div>
<div class="app-header">
  <div class="app-header-inner">
    <div class="header-logo">
      <img src="/icon.svg" alt="Pill Talk"/>
      <span class="app-title">My Medications</span>
    </div>
    <button class="btn-ghost" onclick="clearAll()" style="font-size:13px;padding:7px 14px">Clear all</button>
  </div>
</div>

<main>
  <div class="card">
    <div style="padding:16px;display:flex;gap:8px">
      <input type="text" id="addInput" placeholder="Add a medication..."/>
      <button class="btn-add" onclick="addMed()">Add</button>
    </div>
    <div id="medList"></div>
  </div>

  <div class="action-bar" id="actionBar">
    <div class="action-bar-info"><strong id="medCount">0</strong> medications — tap to check for interactions</div>
    <button class="btn-primary" id="checkBtn" onclick="checkInteractions()">Check Interactions</button>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div class="spinner" id="spinner"><div class="spin-ring"></div><div class="spin-txt">Checking interactions...</div></div>

  <div class="result-card" id="resultCard">
    <div class="result-header" id="resultHeader">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-summary" id="resultSummary"></div>
    </div>
    <div id="noInt" style="display:none;padding:16px;text-align:center;color:var(--green);font-size:15px;font-weight:600;background:var(--green-bg)">&#10003; No significant interactions found</div>
    <div id="intCards"></div>
    <div id="dupSection" style="display:none">
      <div class="section-label" style="color:var(--amber)">&#9888; Possible duplications</div>
      <div id="dupList" style="padding:0 16px 14px;font-size:14px;color:var(--g700);line-height:1.7"></div>
    </div>
    <div id="recSection" style="display:none">
      <div style="padding:14px 16px;background:var(--blue-bg);font-size:14px;color:var(--blue);line-height:1.6">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">&#128203; Recommendation</div>
        <div id="recText"></div>
      </div>
    </div>
    <div style="padding:12px 16px;display:flex;gap:8px">
      <button class="btn-ghost" onclick="copyReport()" style="flex:1">&#10232; Copy Report</button>
      <button class="btn-ghost" onclick="document.getElementById('resultCard').style.display='none'" style="flex:1">&#8635; Reset</button>
    </div>
  </div>
</main>

<nav class="tab-bar">
  <a class="tab-item" href="/app"><div class="tab-icon">&#128138;</div><div class="tab-label">Look Up</div></a>
  <a class="tab-item on" href="/mymeds"><div class="tab-icon">&#128137;</div><div class="tab-label">My Meds</div></a>
  <a class="tab-item" href="/symptoms"><div class="tab-icon">&#128308;</div><div class="tab-label">Symptoms</div></a>
  <a class="tab-item" href="/tracker"><div class="tab-icon">&#128197;</div><div class="tab-label">Tracker</div></a>
  <a class="tab-item" href="/medcard"><div class="tab-icon">&#128203;</div><div class="tab-label">Med Card</div></a>
</nav>

<script>
var meds=JSON.parse(localStorage.getItem('pilltalk_meds')||'[]');
var lastReport={};
function save(){localStorage.setItem('pilltalk_meds',JSON.stringify(meds));}
function renderMeds(){
  var el=document.getElementById('medList');
  var bar=document.getElementById('actionBar');
  document.getElementById('medCount').textContent=meds.length;
  if(!meds.length){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">&#128137;</div><div class="empty-txt">No medications yet</div><div class="empty-sub">Add your first medication above</div></div>';
    bar.style.display='none';return;
  }
  bar.style.display='block';
  el.innerHTML=meds.map(function(m,i){
    return '<div class="med-row"><div class="med-icon">&#9883;</div><div class="med-name">'+m+'</div><div class="med-btns"><button class="med-btn med-btn-look" onclick="lookupDrug(\''+m.replace(/'/g,"\\'")+'\'">Look up</button><button class="med-btn med-btn-rm" onclick="removeMed('+i+')">&#10005;</button></div></div>';
  }).join('');
}
function addMed(){
  var v=document.getElementById('addInput').value.trim();
  if(!v) return;
  if(meds.indexOf(v)===-1){meds.push(v);save();}
  document.getElementById('addInput').value='';
  renderMeds();
}
function removeMed(i){meds.splice(i,1);save();renderMeds();document.getElementById('resultCard').style.display='none';}
function clearAll(){if(confirm('Clear all medications?')){meds=[];save();renderMeds();document.getElementById('resultCard').style.display='none';}}
function lookupDrug(n){window.location.href='/app?drug='+encodeURIComponent(n);}
function showError(msg){var el=document.getElementById('errorBox');el.textContent=msg;el.style.display='block';document.getElementById('spinner').style.display='none';document.getElementById('checkBtn').disabled=false;}
function checkInteractions(){
  if(meds.length<2){showError('Add at least 2 medications to check interactions.');return;}
  document.getElementById('errorBox').style.display='none';
  document.getElementById('resultCard').style.display='none';
  document.getElementById('spinner').style.display='block';
  document.getElementById('checkBtn').disabled=true;
  fetch('/interactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({drugs:meds,level:'simple and clear language'})})
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.error){showError(data.error);return;}
    lastReport=data;
    var header=document.getElementById('resultHeader');
    document.getElementById('resultIcon').textContent=data.safe?'✅':'⚠️';
    header.className='result-header '+(data.safe?'safe':'unsafe');
    document.getElementById('resultSummary').textContent=data.summary||'';
    var noInt=document.getElementById('noInt');
    var cards=document.getElementById('intCards');
    if(!data.interactions||!data.interactions.length){noInt.style.display='block';cards.innerHTML='';}
    else{
      noInt.style.display='none';
      cards.innerHTML=data.interactions.map(function(int){
        var sev=(int.severity||'green').toLowerCase();
        var chipClass=sev==='red'?'sev-serious':sev==='yellow'?'sev-moderate':'sev-mild';
        var chipLabel=sev==='red'?'Serious':sev==='yellow'?'Moderate':'Mild';
        return '<div class="int-card"><div class="int-card-inner"><span class="int-severity '+chipClass+'">'+chipLabel+'</span><div class="int-drugs">'+(int.drugs||'')+'</div><div class="int-desc">'+(int.description||'')+'</div><div class="int-action">'+int.action+'</div></div></div>';
      }).join('');
    }
    var dupSec=document.getElementById('dupSection');
    if(data.duplications&&data.duplications.length){
      document.getElementById('dupList').innerHTML=data.duplications.map(function(d){return '&#8226; '+d;}).join('<br>');
      dupSec.style.display='block';
    } else dupSec.style.display='none';
    var recSec=document.getElementById('recSection');
    if(data.recommendation){document.getElementById('recText').textContent=data.recommendation;recSec.style.display='block';}
    else recSec.style.display='none';
    document.getElementById('spinner').style.display='none';
    document.getElementById('resultCard').style.display='block';
    document.getElementById('checkBtn').disabled=false;
    document.getElementById('resultCard').scrollIntoView({behavior:'smooth',block:'start'});
  })
  .catch(function(err){showError('Could not reach server. ('+err.message+')');});
}
function copyReport(){
  var text='PILL TALK - INTERACTION REPORT\nMedications: '+meds.join(', ')+'\n\n';
  text+='SUMMARY\n'+(lastReport.summary||'')+'\n\n';
  if(lastReport.interactions&&lastReport.interactions.length){
    lastReport.interactions.forEach(function(i){text+='• '+i.drugs+' ['+i.severity+']\n  '+i.description+'\n  Action: '+i.action+'\n\n';});
  }
  if(lastReport.recommendation) text+='RECOMMENDATION\n'+lastReport.recommendation+'\n';
  navigator.clipboard.writeText(text);
}
document.getElementById('addInput').addEventListener('keydown',function(e){if(e.key==='Enter')addMed();});
var urlParams=new URLSearchParams(window.location.search);
var dp=urlParams.get('drug');
if(dp&&meds.indexOf(dp)===-1){meds.push(dp);save();}
renderMeds();
</script>
</body>
</html>
