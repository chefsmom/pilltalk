<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.98)"/>
      <stop offset="100%" stop-color="rgba(209,250,229,0.95)"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(167,243,208,0.9)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="55" rx="210" ry="75" fill="rgba(255,255,255,0.06)"/>

  <!-- Clean centered bottle, no tilt, no spill -->
  <!-- Cap -->
  <rect x="168" y="108" width="176" height="48" rx="14" fill="url(#cap)"/>
  <!-- Cap ridges -->
  <line x1="193" y1="113" x2="193" y2="152" stroke="rgba(5,150,105,0.18)" stroke-width="3" stroke-linecap="round"/>
  <line x1="213" y1="113" x2="213" y2="152" stroke="rgba(5,150,105,0.18)" stroke-width="3" stroke-linecap="round"/>
  <line x1="233" y1="113" x2="233" y2="152" stroke="rgba(5,150,105,0.18)" stroke-width="3" stroke-linecap="round"/>
  <line x1="253" y1="113" x2="253" y2="152" stroke="rgba(5,150,105,0.18)" stroke-width="3" stroke-linecap="round"/>
  <line x1="273" y1="113" x2="273" y2="152" stroke="rgba(5,150,105,0.18)" stroke-width="3" stroke-linecap="round"/>
  <line x1="293" y1="113" x2="293" y2="152" stroke="rgba(5,150,105,0.18)" stroke-width="3" stroke-linecap="round"/>
  <line x1="313" y1="113" x2="313" y2="152" stroke="rgba(5,150,105,0.18)" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottle body -->
  <rect x="178" y="150" width="156" height="188" rx="20" fill="url(#bottle)"/>

  <!-- Bottle shine -->
  <rect x="194" y="162" width="18" height="120" rx="9" fill="rgba(255,255,255,0.4)"/>

  <!-- Label -->
  <rect x="192" y="175" width="128" height="90" rx="10" fill="rgba(5,150,105,0.13)" stroke="rgba(5,150,105,0.22)" stroke-width="1.5"/>

  <!-- Rx on label -->
  <text x="256" y="239" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#059669" text-anchor="middle" opacity="0.88">Rx</text>

  <!-- pilltalk text -->
  <text x="256" y="392"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="72" font-weight="800" fill="white"
    text-anchor="middle" letter-spacing="-2"
  ><tspan>pill</tspan><tspan fill="rgba(255,255,255,0.55)" font-weight="600">talk</tspan></text>

  <ellipse cx="256" cy="472" rx="130" ry="24" fill="rgba(255,255,255,0.04)"/>
</svg>
