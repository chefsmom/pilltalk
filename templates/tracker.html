<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Pill Talk"/>
<meta name="theme-color" content="#ffffff"/>
<title>Dose Tracker — Pill Talk</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<link rel="manifest" href="/manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#059669;--teal-d:#047857;--teal-dd:#065f46;--teal-50:#ecfdf5;--teal-100:#d1fae5;
  --g900:#111827;--g800:#1f2937;--g700:#374151;--g600:#4b5563;--g500:#6b7280;
  --g400:#9ca3af;--g300:#d1d5db;--g200:#e5e7eb;--g150:#eeeff1;--g100:#f3f4f6;--g50:#f9fafb;
  --red:#dc2626;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fffbeb;
  --green:#16a34a;--green-bg:#f0fdf4;--green-b:#bbf7d0;
  --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
}
html{height:100%;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--g50);color:var(--g900);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(83px + var(--safe-bottom))}
.status-bar{height:var(--safe-top);background:#fff}
.app-header{background:#fff;border-bottom:0.5px solid var(--g200);padding:12px 20px;position:sticky;top:var(--safe-top);z-index:50;display:flex;align-items:center;justify-content:space-between}
.app-title{font-size:17px;font-weight:700;letter-spacing:-.2px}
.header-logo{display:flex;align-items:center;gap:8px}
.header-logo img{width:28px;height:28px;border-radius:7px}
.header-date{font-size:13px;color:var(--g500);font-weight:500}
main{padding:16px 16px 8px}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-pad{padding:16px}
.dose-row{display:flex;align-items:center;padding:14px 16px;border-bottom:0.5px solid var(--g100)}
.dose-row:last-child{border-bottom:none}
.dose-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--g300);cursor:pointer;flex-shrink:0;margin-right:12px;display:flex;align-items:center;justify-content:center;transition:all .2s;-webkit-appearance:none;background:#fff}
.dose-check.taken{border-color:var(--teal);background:var(--teal)}
.dose-check.taken::after{content:'✓';color:#fff;font-size:13px;font-weight:800}
.dose-info{flex:1}
.dose-name{font-size:15px;font-weight:600;margin-bottom:2px}
.dose-time{font-size:12px;color:var(--g400)}
.dose-badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
.badge-taken{background:var(--green-bg);color:var(--green)}
.badge-missed{background:var(--red-bg);color:var(--red)}
.badge-pending{background:var(--g100);color:var(--g500)}
input[type=text],input[type=time],select,textarea{width:100%;padding:12px 14px;font-size:15px;font-family:inherit;border:1.5px solid var(--g200);border-radius:12px;background:var(--g50);color:var(--g900);outline:none;-webkit-appearance:none;transition:border-color .15s;margin-bottom:8px}
input[type=text]:focus,input[type=time]:focus,select:focus,textarea:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(5,150,105,.08)}
input::placeholder,textarea::placeholder{color:var(--g400)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.btn-primary{padding:13px;background:var(--teal);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;-webkit-appearance:none;box-shadow:0 2px 6px rgba(5,150,105,.25)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{padding:10px 16px;background:var(--g50);border:1px solid var(--g200);border-radius:10px;font-size:13px;font-weight:500;color:var(--g700);cursor:pointer;font-family:inherit;-webkit-appearance:none}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g400);margin-bottom:10px}
.progress-bar{height:6px;background:var(--g200);border-radius:3px;margin-bottom:6px;overflow:hidden}
.progress-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .4s}
.progress-txt{font-size:12px;color:var(--g500);font-weight:500}
.se-row{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:0.5px solid var(--g100)}
.se-row:last-child{border-bottom:none}
.se-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;margin-right:10px;flex-shrink:0}
.se-info{flex:1}
.se-name{font-size:14px;font-weight:600;margin-bottom:2px}
.se-detail{font-size:13px;color:var(--g500);line-height:1.5}
.se-sev{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.se-mild{background:var(--green-bg);color:var(--green)}
.se-mod{background:var(--amber-bg);color:var(--amber)}
.se-sev-sev{background:var(--red-bg);color:var(--red)}
.empty-state{text-align:center;padding:32px 16px;color:var(--g400)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-txt{font-size:15px;font-weight:500;color:var(--g600);margin-bottom:4px}
.empty-sub{font-size:13px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid rgba(0,0,0,.12);display:flex;padding-bottom:var(--safe-bottom);z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;text-decoration:none;cursor:pointer;min-height:50px}
.tab-icon{font-size:22px;line-height:1;margin-bottom:3px;transition:transform .15s}
.tab-label{font-size:10px;font-weight:500;color:var(--g400)}
.tab-item.on .tab-label{color:var(--teal);font-weight:700}
.tab-item.on .tab-icon{transform:scale(1.1)}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
</style>
</head>
<body>
<div class="status-bar"></div>
<div class="app-header">
  <div class="header-logo">
    <img src="/icon.svg" alt="Pill Talk"/>
    <span class="app-title">Dose Tracker</span>
  </div>
  <span class="header-date" id="todayDate"></span>
</div>
<main>
  <!-- Today's doses -->
  <div class="card">
    <div class="card-pad">
      <div class="section-label">Today's doses</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-txt" id="progressTxt">0 of 0 taken</div>
    </div>
    <div id="doseList"></div>
  </div>

  <!-- Add dose -->
  <div class="card card-pad">
    <div class="section-label">Add medication</div>
    <input type="text" id="doseNameInput" placeholder="Medication name"/>
    <input type="time" id="doseTimeInput"/>
    <select id="doseFreq">
      <option value="daily">Once daily</option>
      <option value="twice">Twice daily</option>
      <option value="three">Three times daily</option>
      <option value="asneeded">As needed</option>
    </select>
    <button class="btn-primary" onclick="addDose()">Add to tracker</button>
  </div>

  <!-- Side effect log -->
  <div class="card">
    <div class="card-pad">
      <div class="section-label">Side effect log</div>
      <input type="text" id="seSymptom" placeholder="Symptom (e.g. nausea, headache)"/>
      <select id="seSeverity">
        <option value="mild">Mild</option>
        <option value="moderate">Moderate</option>
        <option value="severe">Severe</option>
      </select>
      <textarea id="seNotes" placeholder="Notes (optional)..."></textarea>
      <button class="btn-primary" onclick="logSideEffect()">Log side effect</button>
    </div>
    <div id="seList"></div>
  </div>
</main>

<nav class="tab-bar">
  <a class="tab-item" href="/app"><div class="tab-icon">&#128138;</div><div class="tab-label">Look Up</div></a>
  <a class="tab-item" href="/mymeds"><div class="tab-icon">&#128137;</div><div class="tab-label">My Meds</div></a>
  <a class="tab-item" href="/symptoms"><div class="tab-icon">&#128308;</div><div class="tab-label">Symptoms</div></a>
  <a class="tab-item on" href="/tracker"><div class="tab-icon">&#128197;</div><div class="tab-label">Tracker</div></a>
  <a class="tab-item" href="/medcard"><div class="tab-icon">&#128203;</div><div class="tab-label">Med Card</div></a>
</nav>

<script>
var today=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
document.getElementById('todayDate').textContent=today;
var todayKey=new Date().toISOString().slice(0,10);
var doses=JSON.parse(localStorage.getItem('pt_doses')||'[]');
var seLog=JSON.parse(localStorage.getItem('pt_selog')||'[]');
var takenToday=JSON.parse(localStorage.getItem('pt_taken_'+todayKey)||'{}');
function saveDoses(){localStorage.setItem('pt_doses',JSON.stringify(doses));}
function saveSE(){localStorage.setItem('pt_selog',JSON.stringify(seLog));}
function saveTaken(){localStorage.setItem('pt_taken_'+todayKey,JSON.stringify(takenToday));}
function renderDoses(){
  var el=document.getElementById('doseList');
  if(!doses.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">&#128197;</div><div class="empty-txt">No medications tracked</div><div class="empty-sub">Add your first dose below</div></div>';updateProgress(0,0);return;}
  var taken=doses.filter(function(d){return takenToday[d.id];}).length;
  updateProgress(taken,doses.length);
  el.innerHTML=doses.map(function(d){
    var isTaken=!!takenToday[d.id];
    var badge=isTaken?'<span class="dose-badge badge-taken">Taken</span>':'<span class="dose-badge badge-pending">Pending</span>';
    return '<div class="dose-row"><button class="dose-check'+(isTaken?' taken':'')+'" onclick="toggleTaken(\''+d.id+'\')"></button><div class="dose-info"><div class="dose-name">'+d.name+'</div><div class="dose-time">'+d.time+(d.freq!=='asneeded'?' · '+d.freq:' · As needed')+'</div></div>'+badge+'<button onclick="removeDose(\''+d.id+'\')" style="background:none;border:none;color:var(--g400);font-size:18px;cursor:pointer;padding:4px 8px">&#10005;</button></div>';
  }).join('');
}
function updateProgress(taken,total){
  var pct=total?Math.round(taken/total*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressTxt').textContent=taken+' of '+total+' taken today';
}
function toggleTaken(id){takenToday[id]=!takenToday[id];saveTaken();renderDoses();}
function addDose(){
  var name=document.getElementById('doseNameInput').value.trim();
  var time=document.getElementById('doseTimeInput').value;
  if(!name)return;
  var formatTime='';
  if(time){var p=time.split(':');var h=parseInt(p[0]);var m=p[1];var ampm=h>=12?'PM':'AM';h=h%12||12;formatTime=h+':'+m+' '+ampm;}
  doses.push({id:Date.now().toString(),name:name,time:formatTime||'No time set',freq:document.getElementById('doseFreq').value});
  saveDoses();
  document.getElementById('doseNameInput').value='';
  document.getElementById('doseTimeInput').value='';
  renderDoses();
}
function removeDose(id){doses=doses.filter(function(d){return d.id!==id;});delete takenToday[id];saveDoses();saveTaken();renderDoses();}
function renderSE(){
  var el=document.getElementById('seList');
  if(!seLog.length){el.innerHTML='<div class="empty-state" style="padding:20px 16px"><div class="empty-icon">&#128203;</div><div class="empty-txt">No side effects logged</div></div>';return;}
  var sevMap={mild:'dg se-mild',moderate:'dy se-mod',severe:'dr se-sev-sev'};
  var dotMap={mild:'#22c55e',moderate:'#f59e0b',severe:'#ef4444'};
  el.innerHTML=seLog.slice(-10).reverse().map(function(se){
    return '<div class="se-row"><div class="se-dot" style="background:'+dotMap[se.sev]+'"></div><div class="se-info"><div class="se-name">'+se.symptom+' <span class="se-sev '+sevMap[se.sev]+'">'+se.sev+'</span></div><div class="se-detail">'+se.date+(se.notes?' — '+se.notes:'')+'</div></div><button onclick="removeSE(\''+se.id+'\')" style="background:none;border:none;color:var(--g400);font-size:16px;cursor:pointer">&#10005;</button></div>';
  }).join('');
}
function logSideEffect(){
  var sym=document.getElementById('seSymptom').value.trim();
  if(!sym)return;
  seLog.push({id:Date.now().toString(),symptom:sym,sev:document.getElementById('seSeverity').value,notes:document.getElementById('seNotes').value.trim(),date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})});
  saveSE();
  document.getElementById('seSymptom').value='';
  document.getElementById('seNotes').value='';
  renderSE();
}
function removeSE(id){seLog=seLog.filter(function(s){return s.id!==id;});saveSE();renderSE();}
renderDoses();renderSE();
</script>
</body>
</html>
